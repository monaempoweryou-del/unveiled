<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5F66">
<title>מרכז · ניהול הזמנות ומלאי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230E5F66'/><text y='68' x='50' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>מ</text></svg>">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230E5F66'/><text y='68' x='50' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>מ</text></svg>">
</head>
<body>
  <div id="login" class="gate">
    <div class="gate-card">
      <div class="gate-mark">מ</div>
      <h1>מרכז</h1>
      <p class="gate-sub">ניהול הזמנות, לקוחות ומלאי</p>
      <div class="gate-field"><label for="pw">סיסמה</label>
        <input id="pw" type="password" inputmode="numeric" autocomplete="current-password"
               placeholder="הזינו סיסמה" autofocus></div>
      <div class="gate-field" style="margin-block-start:0"><label>מי נכנס</label>
        <div class="seg-big" id="role-pick">
          <button type="button" class="rb active" data-role="owner">בעלים</button>
          <button type="button" class="rb" data-role="dispatcher">מוקד</button>
        </div></div>
      <button id="login-btn" class="btn btn-primary btn-lg btn-block">כניסה</button>
      <p id="login-err" class="gate-err" hidden></p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <button id="menu-btn" class="icon-btn only-mobile" aria-label="תפריט">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="brand"><span class="brand-mark">מ</span><span class="brand-name">מרכז</span></div>
      <div class="topbar-actions"><span id="who" class="who"></span></div>
    </header>
    <div id="scrim" class="scrim" hidden></div>
    <nav id="sidebar" class="sidebar" aria-label="ניווט ראשי"></nav>
    <main id="view" class="view" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar only-mobile" aria-label="ניווט מהיר"></nav>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
