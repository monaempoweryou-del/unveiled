<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E5F66">
<title>מרכז · מערכת ניהול תפעול</title>
<meta name="description" content="מערכת ניהול הזמנות, מלאי ומשלוחים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230E5F66'/><text y='68' x='50' font-size='54' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='700'>מ</text></svg>">
</head>
<body>
  <div id="gate" class="gate">
    <div class="gate-card">
      <div class="gate-mark">מ</div>
      <h1>מרכז</h1>
      <p class="gate-sub">מערכת ניהול תפעול, מלאי ומשלוחים</p>
      <div class="gate-field">
        <label for="code">קוד גישה להדגמה</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="off" placeholder="הזינו את הקוד שקיבלתם">
      </div>
      <button id="gate-btn" class="btn btn-primary btn-lg btn-block">כניסה להדגמה</button>
      <p id="gate-err" class="gate-err" hidden>קוד גישה שגוי. נסו שוב.</p>
      <p class="gate-note">גרסת הדגמה. הנתונים לדוגמה בלבד ואינם נתוני לקוחות אמיתיים.</p>
    </div>
  </div>

  <div id="app" hidden>
    <header class="topbar">
      <button id="menu-btn" class="icon-btn only-mobile" aria-label="תפריט">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="brand">
        <span class="brand-mark">מ</span>
        <span class="brand-name">מרכז</span>
      </div>
      <div class="topbar-actions">
        <button id="role-btn" class="role-chip" aria-haspopup="true">
          <span id="role-label">בעלים</span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <button id="sim-btn" class="icon-btn" aria-label="סימולטור" title="סימולטור הדגמה">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3v4M3 5h4M6 17v4M4 19h4M13 3l2.5 6.5L22 12l-6.5 2.5L13 21l-2.5-6.5L4 12l6.5-2.5L13 3z"/></svg>
        </button>
      </div>
    </header>

    <div id="scrim" class="scrim" hidden></div>
    <nav id="sidebar" class="sidebar" aria-label="ניווט ראשי"></nav>
    <main id="view" class="view" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar only-mobile" aria-label="ניווט מהיר"></nav>

    <aside id="simpanel" class="simpanel" hidden aria-label="סימולטור הדגמה"></aside>
    <div id="toasts" class="toasts" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
